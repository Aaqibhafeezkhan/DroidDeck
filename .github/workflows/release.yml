name: Release

# Disparo MANUAL (Actions -> Release -> Run workflow). O semantic-release decide a
# versão a partir dos commits (feat -> minor, fix -> patch, BREAKING -> major),
# gera o CHANGELOG, cria a tag + a Release e anexa o backend (.zip) e o app (.apk).
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # O instalador (Velopack) precisa saber a versao ANTES de empacotar, mas quem decide a
  # versao e o semantic-release, la no fim. O dry-run calcula a mesma versao sem publicar.
  version:
    name: Próxima versão
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm install

      - id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run | tee dry-run.log
          version=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' dry-run.log || true)
          echo "Próxima versão: ${version:-nenhuma}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Windows .exe)
    needs: version
    runs-on: windows-latest
    env:
      # Sem commit que gere release, empacota com uma versao qualquer: nada e publicado.
      VERSION: ${{ needs.version.outputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build do configurador web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Testes (uma release nunca sai com teste quebrado)
        run: dotnet test DroidDeck.sln -c Release --filter "Category!=RequiresDesktop"

      - name: Publish self-contained (win-x64)
        run: dotnet publish DroidDeck/DroidDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.VERSION }} -o publish

      - name: Embute o web no publish (wwwroot ao lado do exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/wwwroot | Out-Null
          Copy-Item app/build/web/* publish/wwwroot -Recurse -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DroidDeck-win-x64.zip -Force

      # Instalador com atualizacao automatica. O app procura releases.win.json e o .nupkg
      # na ultima Release do GitHub, entao os dois vao anexados junto com o Setup.
      - name: Instalador (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId DroidDeckPC --packVersion $env:VERSION --packDir publish `
            --mainExe DroidDeck.exe --packTitle DroidDeck --packAuthors "Gabriel Freitas" `
            --icon DroidDeck/droiddeck.ico --outputDir velopack
          Move-Item velopack/DroidDeckPC-win-Setup.exe velopack/DroidDeck-Setup.exe
          Remove-Item velopack/DroidDeckPC-win-Portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: backend
          path: |
            DroidDeck-win-x64.zip
            velopack/

  app:
    name: App (Android APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaura assinatura de release (se os secrets existirem)
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
            echo "Assinatura: chave de release"
          else
            echo "Assinatura: debug (sem secrets)"
          fi

      - name: Build do APK
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomeia o APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk DroidDeck.apk

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: DroidDeck.apk

  release:
    name: semantic-release
    needs: [version, backend, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # semantic-release precisa do histórico + tags

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Instala o semantic-release
        run: npm install

      - uses: actions/download-artifact@v8
        with:
          name: backend
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: dist

      - name: semantic-release (decide versão, cria tag/release, anexa binários)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Passo a passo de instalação no topo da release
        if: needs.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          cat .github/release-header.md notes.md > body.md
          gh release edit "$TAG" --notes-file body.md
